<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SciAgent — Authentication</title>
  <link rel="stylesheet" href="../static/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-page">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-brand">
        <svg class="brand-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
        <span class="brand-name">SciAgent</span>
      </a>
      <ul class="nav-links">
        <li>
          <a href="/" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
              <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            </svg>
            Explorer
          </a>
        </li>
        <li>
          <a href="/logon" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
            </svg>
            Initialize
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- AUTH LAYOUT -->
  <div class="app-wrapper" style="padding-top: 120px;">
    <div class="card" style="max-width: 500px; margin: 0 auto; background: var(--bg-secondary);">
      <div class="card-header">
        <h1 style="color: var(--accent-primary);">Access Terminal</h1>
      </div>
      <div class="card-body">
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Please authenticate to access the discovery pipeline.</p>
        
        {% if message %}
        <div style="background: var(--error); color: white; padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          {{ message }}
        </div>
        {% endif %}

        <form class="auth-form" method="POST" action="/signin">
          <div style="margin-bottom: 1.5rem;">
            <label for="user" style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Research Identifier</label>
            <input type="text" id="user" name="user" style="width: 100%; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--glass-border); color: var(--text-primary); border-radius: var(--radius-sm);" placeholder="Username" required />
          </div>

          <div style="margin-bottom: 2rem;">
            <label for="password" style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Security Protocol (Password)</label>
            <input type="password" id="password" name="password" style="width: 100%; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--glass-border); color: var(--text-primary); border-radius: var(--radius-sm);" placeholder="••••••••" required />
          </div>

          <button type="submit" class="btn-primary" style="width: 100%;">
            Execute Login
          </button>
        </form>
        
        <p style="margin-top: 2rem; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
          New Researcher? <a href="/logon" style="color: var(--accent-primary); font-weight: 600;">Register Protocol</a>
        </p>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>© 2026 SciAgent · Evidence-Grounded Scientific Discovery</p>
  </footer>
</body>
</html>
