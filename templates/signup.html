<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SciAgent — Registration</title>
  <link rel="stylesheet" href="../static/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-page">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-brand">
        <svg class="brand-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
        <span class="brand-name">SciAgent</span>
      </a>
      <ul class="nav-links">
        <li><a href="/" class="nav-link">Explorer</a></li>
        <li><a href="/login" class="nav-link">Sign In</a></li>
      </ul>
    </div>
  </nav>

  <!-- AUTH LAYOUT -->
  <div class="app-wrapper" style="padding-top: 80px;">
    <div class="card" style="max-width: 600px; margin: 0 auto; background: var(--bg-secondary);">
      <div class="card-header">
        <h1 style="color: var(--accent-primary);">Researcher Registration</h1>
      </div>
      <div class="card-body">
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Initialize your researcher profile to begin autonomous evidence grounding.</p>
        
        {% if message %}
        <div style="background: var(--error); color: white; padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          {{ message }}
        </div>
        {% endif %}

        <form class="auth-form" method="POST" action="/signup">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
            <div>
              <label for="user" style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Username</label>
              <input type="text" id="user" name="user" style="width: 100%; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--glass-border); color: var(--text-primary); border-radius: var(--radius-sm);" placeholder="Identifier" required />
            </div>
            <div>
              <label for="name" style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Full Name</label>
              <input type="text" id="name" name="name" style="width: 100%; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--glass-border); color: var(--text-primary); border-radius: var(--radius-sm);" placeholder="Dr. John Doe" required />
            </div>
          </div>

          <div style="margin-bottom: 1.5rem;">
            <label for="email" style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Institutional Email</label>
            <input type="email" id="email" name="email" style="width: 100%; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--glass-border); color: var(--text-primary); border-radius: var(--radius-sm);" placeholder="researcher@lab.org" required />
          </div>

          <div style="margin-bottom: 1.5rem;">
            <label for="mobile" style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Mobile Verification</label>
            <input type="tel" id="mobile" name="mobile" style="width: 100%; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--glass-border); color: var(--text-primary); border-radius: var(--radius-sm);" placeholder="10-digit number" required />
          </div>

          <div style="margin-bottom: 2rem;">
            <label for="password" style="display: block; margin-bottom: 0.5rem; color: var(--text-secondary);">Security Key</label>
            <input type="password" id="password" name="password" style="width: 100%; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--glass-border); color: var(--text-primary); border-radius: var(--radius-sm);" placeholder="••••••••" required />
          </div>

          <button type="submit" class="btn-primary" style="width: 100%;">
            Initialize Profile
          </button>
        </form>
        
        <p style="margin-top: 2rem; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
          Already authorized? <a href="/login" style="color: var(--accent-primary); font-weight: 600;">Terminal Access</a>
        </p>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>© 2026 SciAgent · Evidence-Grounded Scientific Discovery</p>
  </footer>
</body>
</html>
